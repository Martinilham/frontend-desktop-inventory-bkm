name: inventory_bkm_desktop
description: Flutter desktop dashboard for Inventory BKM.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  shared_preferences: ^2.0.0
  file_picker: ^8.1.1
  intl: ^0.19.0
  pdf: ^3.10.0
  printing: ^5.11.0
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.6.1
  fl_chart: ^0.71.0
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/

